name: Release

# Pushing a tag like v1.0.2 builds the jar, then waits for approval on the
# "release" environment before publishing the GitHub release.
# It can also be started by hand from the Actions tab for an existing tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.0.2)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Gradle 8.10 itself runs on Java 21; the mod compiles with the Java 25 toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches mod_version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match mod_version=$version in gradle.properties"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew build -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # Add required reviewers to this environment so publishing waits for your approval.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.build.outputs.tag }}" dist/*.jar \
            --title "ThermaDucts ${{ needs.build.outputs.version }}" \
            --notes-file changelog.md
