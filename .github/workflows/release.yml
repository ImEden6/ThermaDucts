name: Release

# Pushing a tag like v1.0.2 builds the jar, then waits for approval on the
# "release" environment before publishing to Modrinth and CurseForge.
# Starting it by hand from the Actions tab defaults to a dry run: everything is
# built and checked (including the tokens) but nothing is published.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.2). Leave empty to use the selected branch."
        required: false
      dry_run:
        description: "Dry run: check everything but publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.version.outputs.ref }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Gradle 8.10 itself runs on Java 21; the mod compiles with the Java 25 toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches mod_version
        id: version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          tag="${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}"
          if [ -n "$tag" ] && [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match mod_version=$version in gradle.properties"
            exit 1
          fi
          if [ -z "$tag" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::A real release needs a tag. Push v$version or enter it as the tag input."
            exit 1
          fi
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version from ${tag:-$GITHUB_REF_NAME} (dry run: $DRY_RUN)"

      - name: Build and test
        run: ./gradlew build -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/*.jar
          if-no-files-found: error

  # Both publish jobs share the "release" environment, so one approval starts
  # both. If one fails, "Re-run failed jobs" retries only that one.
  modrinth:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: dist

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANGELOG: changelog.md
        run: JAR=$(ls dist/*.jar) bash .github/scripts/publish.sh modrinth

  curseforge:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: dist

      - name: Publish to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANGELOG: changelog.md
        run: JAR=$(ls dist/*.jar) bash .github/scripts/publish.sh curseforge
